<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>贪吃蛇 · Snake</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #1a1d29;
    color: #e8e8ef;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    padding: 16px;
  }
  h1 { font-size: 22px; letter-spacing: 2px; }
  .hud {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 15px;
    color: #9aa3b5;
    flex-wrap: wrap;
    justify-content: center;
  }
  .hud b { color: #6ee7a0; font-size: 18px; margin-left: 6px; }
  #p2wrap b { color: #6cb4f0; }
  #p3wrap b { color: #f0c46c; }
  #p4wrap b { color: #c46cf0; }
  #weatherEl { font-size: 15px; }
  .board-wrap { position: relative; }
  canvas {
    background: #232736;
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
    display: block;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(15,17,26,.82);
    border-radius: 10px;
    text-align: center;
    padding: 12px;
  }
  .overlay.show { display: flex; }
  .overlay .title { font-size: 24px; font-weight: 700; color: #ff7b72; }
  .overlay .sub { font-size: 14px; color: #9aa3b5; }
  button {
    margin-top: 6px;
    padding: 9px 28px;
    border: none;
    border-radius: 20px;
    background: #6ee7a0;
    color: #16241c;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #5ad18f; }
  .menu-row { display: none; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .ghost { background: #2c3142; color: #e8e8ef; }
  .ghost:hover { background: #3d4357; }
  .chk {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #9aa3b5;
    margin-top: 4px;
    cursor: pointer;
  }
  .chk input { accent-color: #6ee7a0; }
  .tips { font-size: 13px; color: #6b7385; line-height: 1.7; text-align: center; }
  .mute {
    margin-top: 0;
    padding: 4px 12px;
    font-size: 16px;
    background: #2c3142;
    color: #e8e8ef;
    border-radius: 8px;
  }
  .mute:hover { background: #3d4357; }
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 8px;
  }
  .dbtn {
    margin: 0;
    padding: 0;
    font-size: 20px;
    background: #2c3142;
    color: #e8e8ef;
    border-radius: 12px;
    border: 1px solid #3d4357;
    touch-action: manipulation;
    user-select: none;
  }
  .dbtn:active { background: #3d4357; }
  .dbtn.up { grid-area: 1 / 2; }
  .dbtn.left { grid-area: 2 / 1; }
  .dbtn.mid { grid-area: 2 / 2; font-size: 16px; }
  .dbtn.right { grid-area: 2 / 3; }
  .dbtn.down { grid-area: 3 / 2; }
  @media (pointer: coarse) { .dpad { display: grid; } }
  kbd {
    background: #2c3142;
    border: 1px solid #3d4357;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
</style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <div class="hud">
    <span><span id="p1label">得分</span><b id="score">0</b></span>
    <span id="p2wrap" style="display:none">P2<b id="score2">0</b></span>
    <span id="p3wrap" style="display:none">P3<b id="score3">0</b></span>
    <span id="p4wrap" style="display:none">P4<b id="score4">0</b></span>
    <span id="bestwrap">最高分<b id="best">0</b></span>
    <span id="speedwrap">速度<b id="level">1</b></span>
    <span id="lvlwrap" style="display:none">关卡<b id="lvl">1</b></span>
    <span id="weatherEl">☀️ 晴</span>
    <button class="mute" id="mute" title="声音开关">🔊</button>
  </div>
  <div class="board-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <div class="title" id="ovTitle">贪吃蛇</div>
      <div class="sub" id="ovSub">选择模式开始</div>
      <div class="menu-row" id="menuGroup">
        <button id="btnSingle">单人模式</button>
        <button id="btnLevels" class="ghost">关卡模式</button>
        <button id="btnVersus">双人</button>
        <button id="btnTriple">三人</button>
        <button id="btnQuad">四人</button>
      </div>
      <label class="chk" id="weatherLabel">
        <input type="checkbox" id="weatherToggle" checked /> 天气模式：晴 / 雨 / 雾 / 雪 / 风
      </label>
      <div class="menu-row" id="overGroup" style="display:none">
        <button id="restart">再来一局</button>
        <button id="backMenu" class="ghost">返回菜单</button>
      </div>
    </div>
  </div>
  <div class="dpad" id="dpad">
    <button class="dbtn up" data-dir="up">▲</button>
    <button class="dbtn left" data-dir="left">◀</button>
    <button class="dbtn mid" id="pauseBtn">⏸</button>
    <button class="dbtn right" data-dir="right">▶</button>
    <button class="dbtn down" data-dir="down">▼</button>
  </div>
  <div class="tips">
    单人：<kbd>↑↓←→</kbd> / <kbd>WASD</kbd> / 滑动 / 虚拟键盘 移动，<kbd>空格</kbd> 或点击画面 暂停 ·
    多人对战：P1 方向键，P2 <kbd>WASD</kbd>，P3 <kbd>IJKL</kbd>，P4 小键盘 <kbd>8456</kbd> · 淘汰制，最后存活者获胜 · 天气模式随机切换五种天气 · 关卡模式：每关吃 5 个食物过关，避开障碍物，越往后越快
  </div>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var score2El = document.getElementById("score2");
  var score3El = document.getElementById("score3");
  var score4El = document.getElementById("score4");
  var bestEl = document.getElementById("best");
  var levelEl = document.getElementById("level");
  var weatherEl = document.getElementById("weatherEl");
  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovSub = document.getElementById("ovSub");
  var menuGroup = document.getElementById("menuGroup");
  var overGroup = document.getElementById("overGroup");
  var weatherLabel = document.getElementById("weatherLabel");
  var weatherToggle = document.getElementById("weatherToggle");
  var btnSingle = document.getElementById("btnSingle");
  var btnVersus = document.getElementById("btnVersus");
  var btnTriple = document.getElementById("btnTriple");
  var btnQuad = document.getElementById("btnQuad");
  var btnLevels = document.getElementById("btnLevels");
  var speedWrap = document.getElementById("speedwrap");
  var lvlWrap = document.getElementById("lvlwrap");
  var lvlEl = document.getElementById("lvl");
  var restartBtn = document.getElementById("restart");
  var backMenuBtn = document.getElementById("backMenu");
  var p1Label = document.getElementById("p1label");
  var p2Wrap = document.getElementById("p2wrap");
  var p3Wrap = document.getElementById("p3wrap");
  var p4Wrap = document.getElementById("p4wrap");
  var bestWrap = document.getElementById("bestwrap");

  var W = canvas.width, H = canvas.height;
  var COLS = 20, ROWS = 20, CELL = 20;          // 400x400 棋盘
  var BASE_INTERVAL = 150;                       // 初始每步毫秒
  var MIN_INTERVAL = 60;
  var SPEED_STEP = 10;                           // 每吃 5 个食物加速一档
  var LEVEL_FOODS = 5;                            // 关卡模式：每关需吃食物数
  var WEATHER_DURATION = 12000;                  // 每种天气持续 12 秒

  var DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };
  var ARROW = { up: "↑", down: "↓", left: "←", right: "→" };
  var WEATHERS = {
    sunny: { icon: "☀️", name: "晴", desc: "风平浪静", mult: 1 },
    rain:  { icon: "🌧️", name: "雨", desc: "路滑，转向延迟一步", mult: 1 },
    fog:   { icon: "🌫️", name: "雾", desc: "视野受限，小心行驶", mult: 1 },
    snow:  { icon: "❄️", name: "雪", desc: "冰面，整体提速 25%", mult: 0.75 },
    wind:  { icon: "🌬️", name: "风", desc: "阵风会推动蛇身", mult: 1 }
  };

  // ---- 运行状态 ----
  var state = "menu";                            // menu | running | paused | over
  var mode = "single";
  var playerCount = 1;
  var weatherOn = true;
  var players = [];
  var foods = [];
  var targetFoodCount = 1;
  var totalEaten = 0;
  var obstacles = [];                             // 关卡模式障碍物
  var obstacleMap = {};
  var levelNum = 1;
  var levelEaten = 0;
  var weather = { type: "sunny", windDir: DIRS.right };
  var weatherMs = 0;
  var gustCounter = 0;
  var gustFlashTs = -9999;
  var banner = { text: "", until: 0 };
  var lastTick = 0, lastFrame = 0;
  var best = Number(localStorage.getItem("snake_best") || 0);
  bestEl.textContent = best;

  // ---- 音效（Web Audio 合成，无需音频文件）----
  var audioCtx = null;
  var muted = localStorage.getItem("snake_muted") === "1";
  var muteBtn = document.getElementById("mute");

  function ensureAudio() {
    if (!audioCtx) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      } catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function beep(freq, duration, type, volume, delay) {
    if (muted || !audioCtx) return;
    var t0 = audioCtx.currentTime + (delay || 0);
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.12, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  function sfxEat() { beep(660, 0.07, "square", 0.1); beep(880, 0.08, "square", 0.09, 0.05); }
  function sfxSpeedUp() { beep(520, 0.07, "triangle", 0.12, 0); beep(660, 0.07, "triangle", 0.12, 0.08); beep(880, 0.1, "triangle", 0.12, 0.16); }
  function sfxOver() { beep(440, 0.15, "sawtooth", 0.1, 0); beep(330, 0.15, "sawtooth", 0.1, 0.14); beep(220, 0.3, "sawtooth", 0.1, 0.28); }
  function sfxPause() { beep(520, 0.06, "triangle", 0.08); }
  function sfxWeather() { beep(880, 0.08, "triangle", 0.1, 0); beep(1175, 0.12, "triangle", 0.1, 0.09); }
  function sfxGust() { beep(180, 0.2, "sawtooth", 0.14, 0); beep(140, 0.22, "sawtooth", 0.12, 0.1); }

  function renderMute() { muteBtn.textContent = muted ? "🔇" : "🔊"; }
  muteBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    muted = !muted;
    localStorage.setItem("snake_muted", muted ? "1" : "0");
    renderMute();
    if (!muted) { ensureAudio(); sfxPause(); }
  });
  renderMute();

  // ---- 天气粒子 ----
  var rainFx = [], snowFx = [], windFx = [];
  (function initParticles() {
    var i;
    for (i = 0; i < 60; i++) rainFx.push({ x: Math.random() * W, y: Math.random() * H, v: 320 + Math.random() * 200 });
    for (i = 0; i < 40; i++) snowFx.push({
      baseX: Math.random() * W, y: Math.random() * H,
      v: 40 + Math.random() * 40, r: 1 + Math.random() * 2,
      phase: Math.random() * Math.PI * 2, freq: 0.6 + Math.random() * 0.8
    });
    for (i = 0; i < 24; i++) windFx.push({
      x: Math.random() * W, y: Math.random() * H,
      v: 260 + Math.random() * 200, len: 10 + Math.random() * 18
    });
  })();

  var fogCv = document.createElement("canvas");
  fogCv.width = W; fogCv.height = H;
  var fogCtx = fogCv.getContext("2d");

  // ---- 玩家 / 局面 ----
  var P_CONF = [
    { snake: [{ x: 4, y: 10 }, { x: 3, y: 10 }, { x: 2, y: 10 }],  dir: DIRS.right, color: "#6ee7a0", rgba: "rgba(110,231,160," },
    { snake: [{ x: 15, y: 9 }, { x: 16, y: 9 }, { x: 17, y: 9 }],  dir: DIRS.left,  color: "#6cb4f0", rgba: "rgba(108,180,240," },
    { snake: [{ x: 10, y: 2 }, { x: 10, y: 1 }, { x: 10, y: 0 }],  dir: DIRS.down,  color: "#f0c46c", rgba: "rgba(240,196,108," },
    { snake: [{ x: 9, y: 17 }, { x: 9, y: 18 }, { x: 9, y: 19 }],  dir: DIRS.up,    color: "#c46cf0", rgba: "rgba(196,108,240," }
  ];

  function makePlayer(conf) {
    return { snake: conf.snake.map(function (s) { return { x: s.x, y: s.y }; }), dir: conf.dir, nextDir: conf.dir, lagged: conf.dir, score: 0, alive: true, dying: false, head: null, color: conf.color, rgba: conf.rgba };
  }

  // ---- 关卡布局（避开出生走廊 y=9..11，共 6 套循环，速度递增）----
    function getLevelLayout(n) {
    var idx = ((n - 1) % 6) + 1;
    var cells = [];
    function push(x, y) { cells.push({ x: x, y: y }); }
    function block(x0, y0, w, h) {
    for (var x = x0; x < x0 + w; x++) for (var y = y0; y < y0 + h; y++) push(x, y);
    }
    var i, x, y;
    if (idx === 1) {                              // 四角块
    block(2, 2, 3, 3); block(15, 2, 3, 3); block(2, 15, 3, 3); block(15, 15, 3, 3);
    } else if (idx === 2) {                       // 上下横杠
    block(5, 4, 10, 1); block(5, 15, 10, 1);
    } else if (idx === 3) {                       // 双竖墙（中间留通道）
    block(6, 3, 1, 6); block(6, 13, 1, 4); block(13, 3, 1, 6); block(13, 13, 1, 4);
    } else if (idx === 4) {                       // 回字框（四边留缺口）
    for (x = 5; x <= 14; x++) { if (x !== 9 && x !== 10) { push(x, 4); push(x, 15); } }
  for (y = 5; y <= 14; y++) { if (y < 9 || y > 11) { push(5, y); push(14, y); } }
    } else if (idx === 5) {                       // 双斜线
      for (i = 2; i <= 8; i++) push(i, i);
      for (i = 12; i <= 17; i++) push(i, i);
      for (i = 2; i <= 7; i++) push(19 - i, i);
      for (i = 12; i <= 17; i++) push(19 - i, i);
    } else {                                      // 柱阵
      var xs = [3, 8, 13, 16], ys = [3, 14], xi, yi;
      for (xi = 0; xi < xs.length; xi++) for (yi = 0; yi < ys.length; yi++) block(xs[xi], ys[yi], 2, 3);
    }
    return cells;
  }

  function setObstacles(list) {
    obstacles = list;
    obstacleMap = {};
    list.forEach(function (o) { obstacleMap[o.x + "," + o.y] = true; });
  }

  function startGame(count) {
    playerCount = count;
    mode = count > 1 ? "versus" : "single";
    initRound();
  }

  function startLevels() {
    playerCount = 1;
    mode = "levels";
    levelNum = 1;
    initRound();
  }

  function initRound() {
    players = P_CONF.slice(0, playerCount).map(makePlayer);
    totalEaten = 0;
    foods = [];
    targetFoodCount = playerCount >= 4 ? 2 : 1;
    levelEaten = 0;
    weatherMs = 0;
    gustFlashTs = -9999;
    if (mode === "levels") {
      setObstacles(getLevelLayout(levelNum));
      weather.type = "sunny";
      weatherEl.textContent = "—";
      banner = { text: "🧱 第 1 关 · 吃 " + LEVEL_FOODS + " 个食物过关", until: performance.now() + 2600 };
    } else {
      setObstacles([]);
      if (weatherOn) setWeather(randomWeatherType(), true);
      else { weather.type = "sunny"; weatherEl.textContent = "—"; }
    }
    refillFoods();
    state = "running";
    lastTick = 0;
    setupHudForMode();
    updateHud();
    hideOverlay();
  }

  function setupHudForMode() {
    p1Label.textContent = playerCount > 1 ? "P1" : "得分";
    p2Wrap.style.display = playerCount >= 2 ? "" : "none";
    p3Wrap.style.display = playerCount >= 3 ? "" : "none";
    p4Wrap.style.display = playerCount >= 4 ? "" : "none";
    bestWrap.style.display = playerCount > 1 ? "none" : "";
  speedWrap.style.display = mode === "levels" ? "none" : "";
    lvlWrap.style.display = mode === "levels" ? "" : "none";
  }

  function updateHud() {
    if (!players.length) return;
    var scoreEls = [scoreEl, score2El, score3El, score4El];
    players.forEach(function (p, i) { if (scoreEls[i]) scoreEls[i].textContent = p.score; });
    levelEl.textContent = Math.floor(totalEaten / 5) + 1;
    if (mode === "levels") lvlEl.textContent = levelNum;
  }

  function updateWeatherHud() {
    if (!weatherOn) { weatherEl.textContent = "—"; return; }
    var w = WEATHERS[weather.type];
    weatherEl.textContent = w.icon + " " + w.name +
      (weather.type === "wind" ? " " + ARROW[dirName(weather.windDir)] : "");
  }

  function dirName(d) {
    if (d.y === -1) return "up";
    if (d.y === 1) return "down";
    if (d.x === -1) return "left";
    return "right";
  }

  function randomDir() {
    var names = ["up", "down", "left", "right"];
    return DIRS[names[Math.floor(Math.random() * 4)]];
  }

  function randomWeatherType() {
    var keys = Object.keys(WEATHERS).filter(function (k) { return k !== weather.type; });
    return keys[Math.floor(Math.random() * keys.length)];
  }

  function setWeather(type, silent) {
    weather.type = type;
    weather.windDir = randomDir();
    weatherMs = 0;
    gustCounter = 8 + Math.floor(Math.random() * 5);
    banner = { text: WEATHERS[type].icon + " " + WEATHERS[type].name + " · " + WEATHERS[type].desc, until: performance.now() + 2600 };
    if (!silent) sfxWeather();
    updateWeatherHud();
  }

  function freeCell() {
    var occ = {};
    players.forEach(function (p) {
      p.snake.forEach(function (s) { occ[s.x + "," + s.y] = true; });
    });
    foods.forEach(function (f) { occ[f.x + "," + f.y] = true; });
    obstacles.forEach(function (o) { occ[o.x + "," + o.y] = true; });
    var pt;
    do {
      pt = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (occ[pt.x + "," + pt.y]);
    return pt;
  }

  function refillFoods() {
    while (foods.length < targetFoodCount) foods.push(freeCell());
  }

  function currentInterval() {
    if (mode === "levels") return Math.max(BASE_INTERVAL - (levelNum - 1) * 12, MIN_INTERVAL);
      var lvl = Math.floor(totalEaten / 5);
    var base = Math.max(BASE_INTERVAL - lvl * SPEED_STEP, MIN_INTERVAL);
    return base * WEATHERS[weather.type].mult;
  }

  function hitAnyBody(h, exceptPlayer, includeSelf) {
    if (h.x < 0 || h.y < 0 || h.x >= COLS || h.y >= ROWS) return true;
    if (obstacleMap[h.x + "," + h.y]) return true;
    return players.some(function (q) {
      if (q === exceptPlayer && !includeSelf) return false;
      return q.snake.some(function (s) { return s.x === h.x && s.y === h.y; });
    });
  }

  // ---- 主逻辑 tick ----
  function alivePlayers() {
    return players.filter(function (p) { return p.alive; });
  }

  function eliminateDead() {
    var out = [];
    players.forEach(function (p, i) {
      if (p.dying) {
        p.alive = false; p.dying = false; p.snake = []; p.head = null;
        if (mode === "versus") out.push("P" + (i + 1));
      }
    });
    if (out.length) banner = { text: out.join("、") + " 被淘汰！", until: performance.now() + 2000 };
  }

  function endCheck() {
    var need = mode === "versus" ? 1 : 0;
    if (alivePlayers().length <= need) { gameOver(); return true; }
    return false;
  }

  function tick() {
    if (state !== "running") return;

    // 1. 计算每个存活玩家的下一步，判碰撞（同回合同时判定）
    players.forEach(function (p) {
      if (!p.alive) return;
      var head = { x: p.snake[0].x + p.dir.x, y: p.snake[0].y + p.dir.y };
      var hit = false;
      if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) hit = true;
      if (!hit) hit = !!obstacleMap[head.x + "," + head.y];
      if (!hit) hit = p.snake.some(function (s) { return s.x === head.x && s.y === head.y; });
      if (!hit) hit = players.some(function (q) {
        if (q === p) return false;
        return q.snake.some(function (s) { return s.x === head.x && s.y === head.y; });
      });
      if (hit) { p.dying = true; return; }
      p.head = head;
    });

    // 2. 淘汰死亡玩家（蛇身消失，其余玩家继续）
    eliminateDead();

    // 3. 应用移动与吃食物
    players.forEach(function (p) {
      if (!p.alive || !p.head) return;
      var ateIdx = -1;
      for (var f = 0; f < foods.length; f++) {
        if (foods[f].x === p.head.x && foods[f].y === p.head.y) { ateIdx = f; break; }
      }
      p.snake.unshift(p.head);
      if (ateIdx >= 0) {
        p.score++;
        totalEaten++;
        sfxEat();
        if (mode !== "levels" && totalEaten % 5 === 0) sfxSpeedUp();
        foods.splice(ateIdx, 1);
        if (mode === "levels") {
      levelEaten++;
          if (levelEaten >= LEVEL_FOODS) { levelUp(); return; }
        }
        refillFoods();
      } else {
        p.snake.pop();
      }
      p.head = null;
    });

    // 4. 更新方向（雨天打滑：转向多延迟一拍生效）
    players.forEach(function (p) {
      if (!p.alive) return;
      if (weather.type === "rain") { p.dir = p.lagged; p.lagged = p.nextDir; }
      else { p.dir = p.nextDir; }
    });

    // 5. 大风：定期阵风推动所有蛇
    if (weatherOn && weather.type === "wind") {
      gustCounter--;
      if (gustCounter <= 0) {
        gust();
        gustCounter = 8 + Math.floor(Math.random() * 5);
        if (state !== "running") return;
      }
    }

    // 6. 结束判定：仅剩 1 名存活者（单人即死亡）
    if (endCheck()) return;

    updateHud();
  }

  function gust() {
    sfxGust();
    gustFlashTs = performance.now();
    players.forEach(function (p) {
      if (!p.alive) return;
      var h = { x: p.snake[0].x + weather.windDir.x, y: p.snake[0].y + weather.windDir.y };
      if (hitAnyBody(h, null, true)) { p.dying = true; return; }
      p.snake.unshift(h);
      p.snake.pop();
    });
    eliminateDead();
    endCheck();
  }

  function levelUp() {
    levelNum++;
      levelEaten = 0;
      sfxSpeedUp();
      var p = players[0];
      p.snake = P_CONF[0].snake.map(function (s) { return { x: s.x, y: s.y }; });
      p.dir = p.nextDir = p.lagged = DIRS.right;
      p.alive = true; p.dying = false; p.head = null;
      setObstacles(getLevelLayout(levelNum));
      foods = [];
      refillFoods();
      banner = { text: "🎉 第 " + levelNum + " 关 · 吃 " + LEVEL_FOODS + " 个食物过关", until: performance.now() + 2600 };
      updateHud();
    }

    function gameOver() {
      state = "over";
    sfxOver();
    var title, sub;
    if (mode === "single" || mode === "levels") {
      var s = players[0].score;
      if (s > best) {
        best = s;
        localStorage.setItem("snake_best", String(best));
        bestEl.textContent = best;
        title = "新纪录！";
      } else {
        title = "游戏结束";
      }
      sub = mode === "levels" ? "本局得分 " + s + " 分 · 到达第 " + levelNum + " 关" : "本局得分 " + s + " 分";
    } else {
      var alive = alivePlayers();
      if (alive.length === 1) {
        title = "P" + (players.indexOf(alive[0]) + 1) + " 获胜！";
      } else {
        var maxScore = players.reduce(function (m, p) { return Math.max(m, p.score); }, 0);
        var winners = players.filter(function (p) { return p.score === maxScore; });
        title = winners.length === 1 ? "P" + (players.indexOf(winners[0]) + 1) + " 获胜！" : "平局！";
      }
      sub = players.map(function (p, i) { return "P" + (i + 1) + " " + p.score + " 分"; }).join(" · ");
    }
    showOverlay(title, sub, "over");
  }

  // ---- 渲染 ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function updateParticles(dt, ts) {
    var s = dt / 1000, i, p;
    if (weatherOn && weather.type === "rain") {
      for (i = 0; i < rainFx.length; i++) {
        p = rainFx[i];
        p.y += p.v * s;
        if (p.y > H + 20) { p.y = -20; p.x = Math.random() * W; }
      }
    }
    if (weatherOn && weather.type === "snow") {
      var t = ts / 1000;
      for (i = 0; i < snowFx.length; i++) {
        p = snowFx[i];
        p.y += p.v * s;
        p.baseX += Math.sin(t * p.freq + p.phase) * 12 * s;
        if (p.y > H + 6) { p.y = -6; p.baseX = Math.random() * W; }
        if (p.baseX > W + 10) p.baseX = -10;
        if (p.baseX < -10) p.baseX = W + 10;
      }
    }
    if (weatherOn && weather.type === "wind") {
      var d = weather.windDir;
      for (i = 0; i < windFx.length; i++) {
        p = windFx[i];
        p.x += d.x * p.v * s;
        p.y += d.y * p.v * s;
        if (p.x > W + 30) p.x = -30;
        if (p.x < -30) p.x = W + 30;
        if (p.y > H + 30) p.y = -30;
        if (p.y < -30) p.y = H + 30;
      }
    }
  }

  function drawWeatherFx(ts) {
    var i, p;
    if (!weatherOn || mode === "levels") return;
    if (weather.type === "sunny") {
      ctx.fillStyle = "rgba(255,220,120,0.03)";
      ctx.fillRect(0, 0, W, H);
    } else if (weather.type === "rain") {
      ctx.strokeStyle = "rgba(150,180,230,0.35)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var r = 0; r < rainFx.length; r++) {
        p = rainFx[r];
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - 2, p.y - 10);
      }
      ctx.stroke();
    } else if (weather.type === "snow") {
      ctx.fillStyle = "rgba(240,246,255,0.8)";
      for (var s2 = 0; s2 < snowFx.length; s2++) {
        p = snowFx[s2];
        ctx.beginPath();
        ctx.arc(p.baseX, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (weather.type === "wind") {
      var d = weather.windDir;
      ctx.strokeStyle = "rgba(190,210,235,0.25)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (var w = 0; w < windFx.length; w++) {
        p = windFx[w];
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - d.x * p.len, p.y - d.y * p.len);
      }
      ctx.stroke();
    } else if (weather.type === "fog") {
      fogCtx.clearRect(0, 0, W, H);
      fogCtx.fillStyle = "rgba(12,14,20,0.93)";
      fogCtx.fillRect(0, 0, W, H);
      fogCtx.globalCompositeOperation = "destination-out";
      players.forEach(function (p) {
        if (!p.alive) return;
        var cx = p.snake[0].x * CELL + CELL / 2, cy = p.snake[0].y * CELL + CELL / 2;
        var r = CELL * 5.5;
        var g = fogCtx.createRadialGradient(cx, cy, CELL * 1.2, cx, cy, r);
        g.addColorStop(0, "rgba(0,0,0,1)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        fogCtx.fillStyle = g;
        fogCtx.beginPath();
        fogCtx.arc(cx, cy, r, 0, Math.PI * 2);
        fogCtx.fill();
      });
      fogCtx.globalCompositeOperation = "source-over";
      ctx.drawImage(fogCv, 0, 0);
    }

    // 阵风闪白
    var since = ts - gustFlashTs;
    if (since < 300) {
      ctx.fillStyle = "rgba(255,255,255," + (0.14 * (1 - since / 300)).toFixed(3) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  function draw(ts) {
    ctx.clearRect(0, 0, W, H);

    // 网格
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    for (var i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, ROWS * CELL); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(COLS * CELL, i * CELL); ctx.stroke();
    }

    if (state === "menu") return;

    // 障碍物（关卡模式）
    obstacles.forEach(function (o) {
      ctx.fillStyle = "#3d4357";
      roundRect(o.x * CELL + 1, o.y * CELL + 1, CELL - 2, CELL - 2, 4);
      ctx.fillStyle = "#4d5468";
      roundRect(o.x * CELL + 3, o.y * CELL + 3, CELL - 6, CELL - 6, 2);
    });

    // 食物（呼吸动效）
    var fr = CELL / 2 - 2 + Math.sin(ts / 200) * 1.2;
    ctx.fillStyle = "#ff7b72";
    foods.forEach(function (f) {
      ctx.beginPath();
      ctx.arc(f.x * CELL + CELL / 2, f.y * CELL + CELL / 2, Math.max(fr, 3), 0, Math.PI * 2);
      ctx.fill();
    });

    // 蛇（头亮尾暗）
    players.forEach(function (p) {
      p.snake.forEach(function (s, idx) {
        var t = idx / Math.max(p.snake.length - 1, 1);
        ctx.fillStyle = idx === 0 ? p.color : p.rgba + (1 - t * 0.6).toFixed(2) + ")";
        roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 5);
      });
    });

    // 天气特效与遮罩
    drawWeatherFx(ts);

    // 天气切换横幅
    if (banner.text && ts < banner.until) {
      var alpha = Math.min(1, (banner.until - ts) / 600);
      ctx.font = "bold 15px 'PingFang SC', 'Microsoft YaHei', Arial";
      var tw = ctx.measureText(banner.text).width;
      var bx = (W - tw) / 2 - 14;
      ctx.fillStyle = "rgba(15,17,26," + (0.75 * alpha).toFixed(3) + ")";
      roundRect(bx, 16, tw + 28, 30, 15);
      ctx.fillStyle = "rgba(232,232,239," + alpha.toFixed(3) + ")";
      ctx.textBaseline = "middle";
      ctx.fillText(banner.text, bx + 14, 32);
      ctx.textBaseline = "alphabetic";
    }
  }

  // ---- 主循环 ----
  function frame(ts) {
    var dt = Math.min(ts - lastFrame, 100);
    lastFrame = ts;
    if (state === "running") {
      weatherMs += dt;
      if (weatherOn && mode !== "levels" && weatherMs > WEATHER_DURATION) setWeather(randomWeatherType(), false);
      if (ts - lastTick >= currentInterval()) { lastTick = ts; tick(); }
    }
    updateParticles(dt, ts);
    draw(ts);
    requestAnimationFrame(frame);
  }

  // ---- 覆盖层 ----
  function showOverlay(title, sub, group) {
    ovTitle.textContent = title;
    ovSub.textContent = sub;
    menuGroup.style.display = group === "menu" ? "flex" : "none";
    weatherLabel.style.display = group === "menu" ? "inline-flex" : "none";
    overGroup.style.display = group === "over" ? "flex" : "none";
    overlay.classList.add("show");
  }
  function hideOverlay() { overlay.classList.remove("show"); }

  function showMenu() {
    state = "menu";
    players = [];
    foods = [];
    p1Label.textContent = "得分";
    p2Wrap.style.display = "none";
    p3Wrap.style.display = "none";
    p4Wrap.style.display = "none";
    bestWrap.style.display = "";
    speedWrap.style.display = "";
    lvlWrap.style.display = "none";
    obstacles = [];
    obstacleMap = {};
    showOverlay("贪吃蛇", "选择模式开始", "menu");
  }

  // ---- 输入 ----
  function applyDir(p, d) {
    if (!p || !d || !p.alive) return;
    if (d.x === -p.dir.x && d.y === -p.dir.y) return;   // 禁止 180 度掉头
    p.nextDir = d;
  }

  function togglePause() {
    if (state === "running") {
      state = "paused";
      showOverlay("已暂停", "按 空格 或点击画面继续", null);
      sfxPause();
    } else if (state === "paused") {
      state = "running";
      hideOverlay();
      sfxPause();
    }
  }

  function restart() {
    if (mode === "levels") startLevels();
      else startGame(playerCount);
    }

    function primaryAction() {
      if (state === "over") { restart(); return; }
    togglePause();
  }

  var KEYS_P1 = {
    ArrowUp: DIRS.up, ArrowDown: DIRS.down, ArrowLeft: DIRS.left, ArrowRight: DIRS.right
  };
  var KEYS_P2 = { KeyW: DIRS.up, KeyS: DIRS.down, KeyA: DIRS.left, KeyD: DIRS.right };
  var KEYS_P3 = { KeyI: DIRS.up, KeyK: DIRS.down, KeyJ: DIRS.left, KeyL: DIRS.right };
  var KEYS_P4 = { Numpad8: DIRS.up, Numpad5: DIRS.down, Numpad4: DIRS.left, Numpad6: DIRS.right };

  function keyDir(code) {
    if (KEYS_P1[code]) return { idx: 0, d: KEYS_P1[code] };
    if (KEYS_P2[code]) return { idx: playerCount > 1 ? 1 : 0, d: KEYS_P2[code] };
    if (KEYS_P3[code]) return { idx: playerCount > 1 ? 2 : 0, d: KEYS_P3[code] };
    if (KEYS_P4[code]) return { idx: playerCount > 1 ? 3 : 0, d: KEYS_P4[code] };
    return null;
  }

  document.addEventListener("keydown", function (e) {
    ensureAudio();
    if (e.code === "Space") {
      e.preventDefault();
      if (state !== "menu") primaryAction();
      return;
    }
    if (state !== "running" && state !== "paused") return;
    var kd = keyDir(e.code);
    if (!kd) return;
    e.preventDefault();
    if (players[kd.idx]) applyDir(players[kd.idx], kd.d);
  });

  // 触屏：滑动转向 / 点按暂停或重开（控制 P1）
  var touchX = 0, touchY = 0;
  canvas.addEventListener("touchstart", function (e) {
    ensureAudio();
    var t = e.changedTouches[0];
    touchX = t.clientX;
    touchY = t.clientY;
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchend", function (e) {
    if (state === "menu") return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchX, dy = t.clientY - touchY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { primaryAction(); return; }
    applyDir(players[0], Math.abs(dx) > Math.abs(dy)
      ? { x: dx > 0 ? 1 : -1, y: 0 }
      : { x: 0, y: dy > 0 ? 1 : -1 });
  }, { passive: false });

  // 桌面：点击画面暂停 / 重开
  canvas.addEventListener("click", function () { ensureAudio(); if (state !== "menu") primaryAction(); });
  overlay.addEventListener("click", function () { ensureAudio(); if (state !== "menu" && state !== "over") primaryAction(); });

  // 虚拟方向键（触屏设备显示，控制 P1）
  var DPAD_MAP = { up: DIRS.up, down: DIRS.down, left: DIRS.left, right: DIRS.right };
  Array.prototype.forEach.call(document.querySelectorAll(".dbtn[data-dir]"), function (btn) {
    var handler = function (e) {
      ensureAudio();
      applyDir(players[0], DPAD_MAP[btn.getAttribute("data-dir")]);
      e.preventDefault();
    };
    btn.addEventListener("touchstart", handler, { passive: false });
    btn.addEventListener("mousedown", handler);
  });
  document.getElementById("pauseBtn").addEventListener("click", function () {
    ensureAudio();
    if (state !== "menu") primaryAction();
  });

  // 菜单 / 结束按钮
  btnSingle.addEventListener("click", function () { ensureAudio(); weatherOn = weatherToggle.checked; startGame(1); });
  btnVersus.addEventListener("click", function () { ensureAudio(); weatherOn = weatherToggle.checked; startGame(2); });
  btnTriple.addEventListener("click", function () { ensureAudio(); weatherOn = weatherToggle.checked; startGame(3); });
  btnQuad.addEventListener("click", function () { ensureAudio(); weatherOn = weatherToggle.checked; startGame(4); });
  btnLevels.addEventListener("click", function () { ensureAudio(); startLevels(); });
  restartBtn.addEventListener("click", function (e) { e.stopPropagation(); restart(); });
  backMenuBtn.addEventListener("click", function (e) { e.stopPropagation(); showMenu(); });

  // 启动
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
